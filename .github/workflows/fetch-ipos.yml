name: Fetch IPOs

on:
  schedule:
    - cron: '0 1 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  fetch-ipos:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Run IPO script
        env:
          IPOALERTS_API_KEY: ${{ secrets.IPOALERTS_API_KEY }}
        run: bash fetch_open_ipos.sh

      - name: Validate JSON
        run: jq -e 'type == "array"' open_ipos.json > /dev/null

      - name: Commit updated JSON
        run: |
          git add open_ipos.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update IPO data"
            git push
          else
            echo "JSON unchanged; no commit needed."
          fi

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public
          cp open_ipos.json public/open_ipos.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
